<html lang="en" dir="ltr" data-color-mode="system" data-contrast="system" data-motion="system" data-text-size="100" data-density="comfortable">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>ApplyTrack</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="vendor/tailwind.css" />
  <link rel="stylesheet" href="app.css" />
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to application details</a>

  <div id="app-shell" class="app-shell">
    <header class="app-header">
      <a class="wordmark" href="#application-list" aria-label="ApplyTrack home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <path d="M7 8.5h18M7 16h11M7 23.5h8" />
            <path d="m20 21 3 3 5-7" />
          </svg>
        </span>
        <span class="wordmark-copy" aria-hidden="true">
          <span><span>Apply</span><strong>Track</strong></span>
          <small>Opportunity command center</small>
        </span>
      </a>
      <nav class="header-actions" aria-label="Application actions">
        <button id="poll-btn" class="button button-secondary" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3a9 9 0 1 1-6.36 2.64M12 7a5 5 0 1 1-3.54 1.46" />
            <circle cx="12" cy="12" r="1.5" />
          </svg>
          Poll for leads
        </button>
        <button id="new-btn" class="button button-primary" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New application
        </button>
        <button id="settings-btn" class="icon-button" type="button" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3V9.6h.1A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.5 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.5a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4h-.1A1.7 1.7 0 0 0 19.4 15Z" />
          </svg>
        </button>
      </nav>
    </header>

    <section id="pipeline" class="pipeline" aria-label="Application status filters"></section>

    <div id="workspace" class="workspace">
      <aside id="application-list" class="list-pane" aria-labelledby="application-list-heading">
        <div class="list-tools">
          <div class="list-heading-row">
            <h1 id="application-list-heading">Applications</h1>
            <span id="app-count" class="result-count" aria-live="polite">0 applications</span>
          </div>
          <label class="search-field" for="search">
            <span class="field-label">Search applications</span>
            <span class="search-control">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="6.5" />
                <path d="m16 16 4 4" />
              </svg>
              <input id="search" type="search" autocomplete="off" placeholder="Company, role, or note" />
            </span>
          </label>
          <div class="filter-row" role="group" aria-label="Filter applications">
            <label for="filter-lane">
              <span>Lane</span>
              <select id="filter-lane">
                <option value="">All lanes</option>
                <option value="dotnet">.NET / backend</option>
                <option value="devrel">Developer relations</option>
                <option value="ai">AI / agentic</option>
              </select>
            </label>
            <label for="filter-status">
              <span>Status</span>
              <select id="filter-status">
                <option value="">All statuses</option>
                <option value="lead">Lead</option>
                <option value="ready">Ready</option>
                <option value="applied">Applied</option>
                <option value="screen">Screen</option>
                <option value="onsite">Onsite</option>
                <option value="offer">Offer</option>
                <option value="rejected">Rejected</option>
                <option value="passed">Passed</option>
              </select>
            </label>
            <label class="filter-sort" for="sort-order">
              <span>Sort by</span>
              <select id="sort-order">
                <option value="pipeline">Pipeline order</option>
                <option value="score">Fit score (high to low)</option>
                <option value="created">Date posted (newest first)</option>
                <option value="company">Company name (A to Z)</option>
              </select>
            </label>
          </div>
        </div>
        <ul id="app-list" class="application-list" aria-label="Matching applications"></ul>
      </aside>

      <main id="content" class="content-pane" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-actions" aria-label="Mobile application actions">
    <button id="m-list" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      <span>Applications</span>
    </button>
    <button id="m-new" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      <span>New</span>
    </button>
    <button id="m-poll" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-6.36 2.64M12 7a5 5 0 1 1-3.54 1.46" /><circle cx="12" cy="12" r="1.5" /></svg>
      <span>Poll</span>
    </button>
    <button id="m-settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" /></svg>
      <span>Settings</span>
    </button>
  </nav>

  <input id="import-file" type="file" accept="application/json,.json" hidden />
  <div id="status-message" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="alert-message" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <div id="toast" class="toast" aria-hidden="true"></div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog">
      <h2 id="confirm-title">Confirm action</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="button button-secondary" value="cancel">Cancel</button>
        <button id="confirm-accept" class="button button-danger" value="confirm">Confirm</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
